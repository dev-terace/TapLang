version: '3.8'

services:
  # 1. PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: TapLang1901603!
      POSTGRES_DB: tap_lang_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tap-lang-network

  # 2. Redis (Socket.IO 어댑터 및 캐싱용)
  redis:
    image: redis:7-alpine
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tap-lang-network

  # 3. Node.js + Socket.IO 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node_js
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://admin:TapLang1901603!@postgres:5432/tap_lang_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    command: sh -c "npx prisma migrate deploy && node dist/index.js"  

    networks:
      - tap-lang-network

    

  # 4. Vue.js + TypeScript 프론트엔드 (개발용)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite
    restart: always
    ports:
      - "5173:5173" # Vite 기본 포트
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - tap-lang-network




volumes:
  pgdata:

networks:
  tap-lang-network:
    driver: bridge