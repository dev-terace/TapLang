# 개발 환경 hot-reload 환경
# backend package.json devDependencies "ts-node-dev": "^2.0.0" 추가
# docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  # 1. PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tap-lang-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tap_lang_db"]
      interval: 5s
      timeout: 5s
      retries: 10  

  # 2. Redis (Socket.IO 어댑터 및 캐싱용)
  redis:
    image: redis:7-alpine
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tap-lang-network

  # 3. Node.js + Socket.IO 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node_js
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${APP_PORT}
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}?schema=public"
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
      
    command: sh -c "npx prisma migrate deploy && npm start"

    networks:
      - tap-lang-network

    

  # 4. Vue.js + TypeScript 프론트엔드 (개발용)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite
    restart: always
    ports:
      - "5173:80" #nginx 포트
    environment:
      - VITE_API_URL=http://localhost:3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - tap-lang-network




volumes:
  pgdata:

networks:
  tap-lang-network:
    driver: bridge